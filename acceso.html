<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Acceso del personal · Delicias</title><link rel="stylesheet" href="/assets/app.css"><link rel="apple-touch-icon" href="/assets/icon-192.png"></head><body><main class="auth"><a class="brand" href="/"><img src="/assets/logo-portales.png" alt=""><span>Estacionómetros<small>ACCESO DEL PERSONAL</small></span></a><div class="card" style="margin-top:24px"><h2 id="heading">Solicitar acceso</h2><div class="notice tariff-reminder"><b>Recordatorio:</b> las tarifas de infracción siguen pendientes de autorización y publicación oficial.</div><p id="intro" class="muted">Registra tu cuenta de personal. Administración debe revisar y activar tu acceso antes de operar.</p><form id="access-form"><div id="signup-fields"><label for="person-name">Nombre completo</label><input id="person-name" required maxlength="80" autocomplete="name"><label for="person-phone">Teléfono</label><input id="person-phone" maxlength="20" type="tel" autocomplete="tel"></div><label for="person-email">Correo</label><input id="person-email" required type="email" autocomplete="email"><div id="password-fields"><label for="new-password">Contraseña</label><input id="new-password" required type="password" minlength="12" autocomplete="new-password"><label for="repeat-password">Repetir contraseña</label><input id="repeat-password" required type="password" minlength="12" autocomplete="new-password"></div><button id="submit">Solicitar acceso</button></form><div id="access-message" role="status" hidden></div><p><button id="mode" class="secondary">Recuperar contraseña</button></p><a href="/panel">Volver al acceso de operadores</a></div></main><script type="module" src="/assets/access.js"></script></body></html>
