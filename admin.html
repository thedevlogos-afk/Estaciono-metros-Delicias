<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administración · Estacionómetros Delicias</title><meta name="robots" content="noindex"><link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--n:#06235a;--b:#1456d9;--bg:#f3f7fd;--c:#fff;--tx:#0c1a3a;--mu:#6b7a99;--bd:#e1e9f7;--ok:#0f9d63;--wa:#ff8a00;--er:#d93a3a}
@media(prefers-color-scheme:dark){:root{--bg:#071226;--c:#0f1f3d;--tx:#eaf2ff;--mu:#98abd0;--bd:#1f3564}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}header img{width:34px;height:34px;border-radius:9px}header b{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;background:var(--c);border-bottom:1px solid var(--bd)}nav button{background:none;border:0;padding:8px 16px;border-radius:99px;color:var(--mu);font:600 14px inherit;cursor:pointer;white-space:nowrap}nav .on{background:var(--b);color:#fff}
main{max-width:1000px;margin:auto;padding:20px}.c{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.k{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}.k .c{margin:0}.v{font:700 32px/1.1 system-ui;color:var(--b)}.m{color:var(--mu);font-size:13px}
input,select{width:100%;padding:12px;margin:5px 0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
button.p,.s{border:0;border-radius:10px;padding:10px 16px;background:var(--b);color:#fff;font:600 14px inherit;cursor:pointer}.s{background:var(--bd);color:var(--tx)}
.t{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}.pendiente{background:var(--wa)}.procedente{background:var(--ok)}.improcedente{background:var(--er)}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.r select{width:auto;margin:0}.bt{height:10px;background:var(--b);border-radius:5px;margin:2px 0 8px}
#map{height:min(62vh,520px);border-radius:16px;z-index:0}.hid{display:none}.lg{max-width:380px;margin:12vh auto}
</style></head><body>
<div id="auth" class="lg"><div class="c" style="text-align:center"><img src="/icons/icon-192.png" width="72" height="72" style="border-radius:18px" alt=""><h2 style="margin:10px 0 2px">Administración</h2><div class="m" style="margin-bottom:12px">Consejo Municipal de Estacionómetros</div>
<form id="fa" style="text-align:left"><label class="m">Correo</label><input id="em" type="email" required><label class="m">Contraseña</label><input id="pw" type="password" required><button class="p" style="width:100%">Entrar</button><p id="msg" class="m"></p></form></div></div>
<div id="app" class="hid"><header><img src="/icons/icon-192.png" alt=""><b>Administración</b><span id="who" class="m"></span><button class="s" onclick="location.reload()">Salir</button></header>
<nav><button data-v="res" class="on">Resumen</button><button data-v="map">Mapa</button><button data-v="rep">Reportes</button><button data-v="cor">Cortes</button><button data-v="eq">Equipo</button></nav>
<main><div id="res"></div><div id="map-w" class="hid"><div class="m" id="mi" style="margin-bottom:8px"></div><div id="map"></div><div class="m" style="margin-top:8px">🟢 supervisor en línea · ⚪ sin señal reciente · 🟠 reporte por revisar</div></div><div id="rep" class="hid"></div><div id="cor" class="hid"></div><div id="eq" class="hid"></div></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SB='https://jawtbygyawivolwudpax.supabase.co',K='sb_publishable__dFXTrjmFzsHavJNGe596A_Y8-YETPV';
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tok,cur='res',map,lay;
const api=async(p,o={})=>{const r=await fetch(SB+p,{...o,headers:{apikey:K,Authorization:'Bearer '+(tok||K),'Content-Type':'application/json',...(o.headers||{})}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.msg||j?.message||j?.error_description||'Error');return j};
const ago=t=>{if(!t)return 'sin datos';const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'ahora':m<60?`hace ${m} min`:new Date(t).toLocaleString('es-MX')};
const on=t=>t&&Date.now()-new Date(t)<9e5,hoy=()=>encodeURIComponent(new Date(new Date().setHours(0,0,0,0)).toISOString());
$('fa').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('em').value,password:$('pw').value})});tok=j.access_token;
const [p]=await api('/rest/v1/perfiles?select=*&user_id=eq.'+j.user.id);if(!p||!p.activo||p.rol!=='admin'){tok=null;$('msg').textContent='Acceso solo para administradores.';return}
$('who').textContent=p.nombre||'';$('auth').classList.add('hid');$('app').classList.remove('hid');go('res');setInterval(()=>go(cur,1),15000)}catch(er){$('msg').textContent=er.message}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v,q){if(q&&document.activeElement?.closest('#rep'))return;cur=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
['res','map-w','rep','cor','eq'].forEach(x=>$(x).classList.toggle('hid',x!=(v=='map'?'map-w':v)));({res,map:mp,rep,cor,eq})[v]().catch(e=>alert(e.message))}
async function res(){const [s,c,p]=await Promise.all([api('/rest/v1/rpc/estadisticas',{method:'POST',body:'{}'}),api('/rest/v1/cortes?select=monto&creado=gte.'+hoy()),api('/rest/v1/perfiles?select=ubicacion_at&rol=eq.inspector&activo=eq.true')]);
const mx=Math.max(1,...s.dias.map(d=>d.n));
$('res').innerHTML=`<div class="k"><div class="c"><div class="v">${s.por_estatus.pendiente||0}</div><div class="m">Por revisar</div></div><div class="c"><div class="v">${s.minutos_atencion??'–'}</div><div class="m">Min. de atención</div></div><div class="c"><div class="v">$${c.reduce((a,x)=>a+ +x.monto,0).toLocaleString('es-MX')}</div><div class="m">Cortes de hoy</div></div><div class="c"><div class="v">${p.filter(x=>on(x.ubicacion_at)).length}/${p.length}</div><div class="m">Supervisores en línea</div></div></div>
<div class="c"><b>Reportes, últimos 7 días</b><div style="margin-top:10px">${s.dias.map(d=>`<div class="m">${d.d} · ${d.n}</div><div class="bt" style="width:${d.n/mx*100}%"></div>`).join('')||'<div class="m">Sin reportes.</div>'}</div></div>
<div class="c"><b>Parquímetros con más reportes</b>${s.top_parquimetros.map(t=>`<div>${esc(t.id)} · ${t.n}</div>`).join('')||'<div class="m">–</div>'}</div>`}
async function mp(){if(!map){map=L.map('map').setView([28.1895,-105.4715],16);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);lay=L.layerGroup().addTo(map)}
setTimeout(()=>map.invalidateSize(),60);
const [q,r,p]=await Promise.all([api('/rest/v1/parquimetros?select=id,lat,lng'),api('/rest/v1/reportes?select=folio,parquimetro:parquimetros(lat,lng)&estatus=eq.pendiente'),api('/rest/v1/perfiles?select=nombre,lat,lng,ubicacion_at&rol=eq.inspector&activo=eq.true&lat=not.is.null')]);
lay.clearLayers();q.forEach(m=>m.lat&&L.circleMarker([m.lat,m.lng],{radius:4,color:'#9db4e0',weight:1,fillColor:'#c9d8f5',fillOpacity:.9}).bindTooltip(m.id).addTo(lay));
r.forEach(x=>x.parquimetro?.lat&&L.circleMarker([x.parquimetro.lat,x.parquimetro.lng],{radius:10,color:'#fff',weight:2,fillColor:'#ff8a00',fillOpacity:1}).bindTooltip('Reporte '+x.folio).addTo(lay));
p.forEach(x=>L.circleMarker([x.lat,x.lng],{radius:9,color:'#fff',weight:2,fillColor:on(x.ubicacion_at)?'#0f9d63':'#8a97b3',fillOpacity:1}).bindTooltip(esc(x.nombre)+' · '+ago(x.ubicacion_at)).addTo(lay));
$('mi').textContent=`${p.filter(x=>on(x.ubicacion_at)).length} supervisores en línea · ${r.length} reportes por revisar`}
async function rep(){const [l,al,ps]=await Promise.all([api('/rest/v1/reportes?select=*&order=creado.desc&limit=40'),api('/rest/v1/alertas?select=reporte_id,leida'),api('/rest/v1/perfiles?select=user_id,nombre&rol=eq.inspector&activo=eq.true')]);
l.sort((a,b)=>(a.estatus=='pendiente'?0:1)-(b.estatus=='pendiente'?0:1));
$('rep').innerHTML=l.map(r=>{const a=al.filter(x=>x.reporte_id==r.id);return`<div class="c"><b>${esc(r.folio)}</b> · ${esc(r.parquimetro_id)} <span class="t ${r.estatus}">${r.estatus}</span>
<div>${esc(r.falla)} · depositó $${r.monto} · ${esc(r.placa)}</div><div class="m">${esc(r.nombre)} · ${esc(r.telefono)} · ${ago(r.creado)} · ${a.length} alertas (${a.filter(x=>x.leida).length} leídas)${r.nota_agente?' · '+esc(r.nota_agente):''}</div>
${r.estatus=='pendiente'?`<div class="r"><button class="p" onclick="al('${r.id}')">Alertar a los más cercanos</button><select id="i${r.id}">${ps.map(x=>`<option value="${x.user_id}">${esc(x.nombre)}</option>`).join('')}</select><button class="s" onclick="al('${r.id}',1)">Alertar</button></div>`:''}</div>`}).join('')||'<div class="c">Sin reportes.</div>'}
async function al(id,sel){const b={p_rep:id};if(sel)b.p_ins=$('i'+id).value;const n=await api('/rest/v1/rpc/alertar_reporte',{method:'POST',body:JSON.stringify(b)});alert(n+' supervisor(es) alertado(s).');rep()}
async function cor(){const [l,ps]=await Promise.all([api('/rest/v1/cortes?select=*&order=creado.desc&limit=40'),api('/rest/v1/perfiles?select=user_id,nombre')]);const nm=id=>esc(ps.find(p=>p.user_id==id)?.nombre||'–');
const h=l.filter(x=>new Date(x.creado)>new Date().setHours(0,0,0,0)),tot=h.reduce((a,x)=>a+ +x.monto,0),por={};h.forEach(x=>por[x.inspector_id]=(por[x.inspector_id]||0)+ +x.monto);
$('cor').innerHTML=`<div class="k"><div class="c"><div class="v">$${tot.toLocaleString('es-MX')}</div><div class="m">Recogido hoy · ${h.length} cortes</div></div></div>
${Object.entries(por).map(([i,v])=>`<div class="c">${nm(i)} <b style="float:right">$${v.toLocaleString('es-MX')}</b></div>`).join('')}
<div class="c"><b>Últimos cortes</b>${l.map(x=>`<div class="r"><span>${esc(x.parquimetro_id)}</span><b>$${x.monto}</b><span class="m">${nm(x.inspector_id)} · ${ago(x.creado)}${x.nota?' · '+esc(x.nota):''}</span></div>`).join('')||'<div class="m">Sin cortes.</div>'}</div>`}
async function eq(){const l=await api('/rest/v1/perfiles?select=*&order=creado.desc');
$('eq').innerHTML=l.map(p=>`<div class="c"><b>${esc(p.nombre)}</b> · ${esc(p.telefono)} <span class="t ${p.activo?'procedente':'pendiente'}">${p.activo?'activo':'pendiente'}</span> <span class="m">${p.rol} · ${ago(p.ubicacion_at)}</span>
<div class="r"><button class="s" onclick="up('${p.user_id}',{activo:${!p.activo}})">${p.activo?'Desactivar':'Aprobar'}</button><button class="s" onclick="up('${p.user_id}',{rol:'${p.rol=='admin'?'inspector':'admin'}'})">Hacer ${p.rol=='admin'?'supervisor':'admin'}</button></div></div>`).join('')}
async function up(id,b){await api('/rest/v1/perfiles?user_id=eq.'+id,{method:'PATCH',body:JSON.stringify(b)});eq()}
</script></body></html>
